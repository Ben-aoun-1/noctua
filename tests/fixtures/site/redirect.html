<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Redirector</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; }
    </style>
  </head>
  <body>
    <h1>Sponsored listing</h1>
    <p>This page looks ordinary and passes the check the navigate tool runs on it.</p>
    <script>
      // The whole point of this fixture: the hop happens long after `navigate` returned and its
      // landing check passed, which is the gap the loop's capture-time re-check has to close.
      // 2.5s is many times longer than the capture that follows the navigation, so the redirect
      // lands between two turns rather than mid-snapshot however loaded the machine is.
      setTimeout(function () { location.href = "offsite.html" }, 2500)
    </script>
  </body>
</html>

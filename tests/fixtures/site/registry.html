<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Companies Registry</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; }
      form { margin: 1.5rem 0; display: flex; gap: 0.5rem; align-items: center; }
      input, select, button { font: inherit; padding: 0.35rem 0.6rem; }
    </style>
  </head>
  <body>
    <nav><a href="index.html">Home</a></nav>
    <h1>Fixture Companies Registry</h1>
    <p>Search the register by company name.</p>

    <!-- Plain GET form: submitting navigates to company.html?q=<term>. -->
    <form action="company.html" method="get">
      <label for="q">Company name</label>
      <input id="q" name="q" type="search" placeholder="Company name" />
      <select name="jurisdiction">
        <option value="ew">England and Wales</option>
        <option value="sc">Scotland</option>
      </select>
      <button type="submit">Search</button>
    </form>

    <h2>Filters</h2>
    <p>
      <label for="country">Country</label>
      <!-- Stands in for the VIES member-state picker: far more options than one element name holds. -->
      <select id="country" name="country"></select>

      <label for="filing">Filing</label>
      <!-- The first option's `label` attribute differs from its text, as some real registries do:
           Playwright selects by `option.label`, so that is what the listing must advertise. -->
      <select id="filing" name="filing">
        <option value="ar" label="Annual return (B1)">AR — B1</option>
        <option value="cs">Confirmation statement</option>
      </select>
    </p>
    <script>
      const COUNTRIES = [
        "Austria", "Belgium", "Bulgaria", "Croatia", "Cyprus", "Czechia", "Denmark", "Estonia",
        "Finland", "France", "Germany", "Greece", "Hungary", "Ireland", "Italy", "Latvia",
        "Lithuania", "Luxembourg", "Malta", "Netherlands", "Poland", "Portugal", "Romania",
        "Slovakia", "Slovenia", "Spain", "Sweden",
      ]
      const country = document.querySelector("#country")
      for (const name of COUNTRIES) {
        const option = document.createElement("option")
        option.value = name.slice(0, 2).toUpperCase()
        option.textContent = name
        country.append(option)
      }
    </script>

    <h2>Recently viewed</h2>
    <ul>
      <li><a href="company.html?q=Glowbar">Glowbar Ltd</a></li>
      <li><a href="vendor.html">Glowbar vendor site</a></li>
    </ul>
  </body>
</html>
